<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="theme-color" content="#0f1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GoodWe">
    <meta name="description" content="GoodWe - Carregamento de Veículos Elétricos">
    <title>GoodWe - Carregador</title>
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiR29vZFdlIiwic2hvcnRfbmFtZSI6Ikdvb2RXZSIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMGYxMTE3IiwidGhlbWVfY29sb3IiOiIjMGYxMTE3IiwiaWNvbnMiOlt7InNyYyI6ImRhdGE6aW1hZ2Uvc3ZnK3htbCw8c3ZnIHhtbG5zPSdodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2Zycgdmlld0JveD0nMCAwIDEwMCAxMDAnPjxyZWN0IHdpZHRoPScxMDAnIGhlaWdodD0nMTAwJyByeD0nMjAnIGZpbGw9JyNlNTM5MzUnLz48dGV4dCB4PSc1MCcgeT0nNjUnIGZvbnQtc2l6ZT0nNDAnIGZpbGw9J3doaXRlJyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmb250LWZhbWlseT0nc2Fucy1zZXJpZic+4peRIC8+dGV4dD48L3N2Zz4iLCJzaXplcyI6IjUxMng1MTIiLCJ0eXBlIjoiaW1hZ2Uvc3ZnK3htbCJ9XX0=">
    <style>
        @import url('https://fonts.bunny.net/css?family=instrument-sans:400,500,600,700');

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f1117;
            --bg-card: #1a1a1a;
            --bg-input: #181b22;
            --border: #343843;
            --text: #EDEDEC;
            --text-secondary: #a0a0a0;
            --text-muted: #8a8f98;
            --primary: #e53935;
            --primary-hover: #c62828;
            --primary-glow: rgba(229, 57, 53, 0.3);
            --font: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
        }

        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            animation: fadeIn 0.3s ease;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo svg {
            width: 22px;
            height: 22px;
            color: white;
        }

        .brand {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        /* Main Map Area */
        .main-map-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 0 20px 20px 20px;
            gap: 16px;
        }

        .map-wrapper {
            flex: 1;
            min-height: 0;
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        #main-map {
            width: 100%;
            height: 100%;
        }

        .map-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1001;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 24px;
            display: none;
            align-items: center;
            gap: 10px;
            color: var(--text);
            font-size: 13px;
            max-width: 90%;
            flex-wrap: wrap;
            justify-content: center;
            text-align: center;
        }

        .map-loading.active {
            display: flex;
        }

        .map-loading .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .map-count {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-secondary);
            display: none;
        }

        .map-count.active {
            display: block;
        }

        .map-count strong {
            color: var(--primary);
        }

        .leaflet-control-zoom a {
            background: var(--bg-card) !important;
            color: var(--text) !important;
            border-color: var(--border) !important;
        }

        .leaflet-control-zoom a:hover {
            background: var(--bg-input) !important;
        }

        .custom-marker {
            background: transparent;
            border: none;
            border-radius: 0;
            box-shadow: none;
            display: block;
        }

        .custom-marker svg {
            width: 16px;
            height: 16px;
            color: white;
        }

        .user-marker {
            background: #3b82f6;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: inline-block;
            width: 20px;
            height: 20px;
        }

        .leaflet-popup-content-wrapper {
            border-radius: 10px !important;
        }

        .leaflet-popup-tip {
            background: white !important;
        }

        .charger-popup {
            font-family: var(--font);
            min-width: 200px;
        }

        .charger-popup h3 {
            margin: 0 0 4px 0;
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .charger-popup p {
            margin: 0 0 2px 0;
            font-size: 12px;
            color: #666;
        }

        .charger-popup .popup-type {
            display: inline-block;
            background: #e53935;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            margin: 6px 0;
        }

        .charger-popup .popup-btn {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 8px 12px;
            background: #e53935;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            font-family: var(--font);
        }

        .charger-popup .popup-btn:hover {
            background: #c62828;
        }

        /* Charger Card at Bottom */
        .charger-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 20px;
            flex-shrink: 0;
        }

        .charger-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .charger-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .charger-icon {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .charger-icon svg {
            width: 20px;
            height: 20px;
            color: white;
        }

        .charger-name {
            font-size: 14px;
            font-weight: 600;
        }

        .charger-id {
            font-size: 12px;
            color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            background: rgba(229, 57, 53, 0.1);
            color: var(--primary);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .charger-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .detail-item {
            background: var(--bg-input);
            border-radius: 8px;
            padding: 10px 12px;
        }

        .detail-label {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .detail-value {
            font-size: 13px;
            font-weight: 600;
        }

        .detail-value.highlight {
            color: var(--primary);
        }

        .nfc-tip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(229, 57, 53, 0.1);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 14px;
        }

        .nfc-tip svg {
            width: 18px;
            height: 18px;
            color: var(--primary);
            flex-shrink: 0;
        }

        .nfc-tip span {
            font-size: 12px;
            color: var(--primary);
            line-height: 1.4;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary svg {
            width: 20px;
            height: 20px;
        }

        .route-control {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            z-index: 1000;
            display: none;
        }

        .route-control.active {
            display: block;
        }

        .route-info-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 8px;
        }

        .route-info-title {
            margin: 0 0 4px 0;
            color: var(--text);
            font-weight: 600;
            font-size: 13px;
        }

        .route-info-detail {
            margin: 0;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .route-info-link {
            display: inline-block;
            margin-top: 6px;
            color: #e53935;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-cancel-route {
            width: 100%;
            padding: 12px;
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel-route:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Charging Screen */
        .screen-charging {
            padding: 24px;
        }

        .charging-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 32px;
        }

        .charging-icon-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .charging-icon-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid var(--border);
        }

        .charging-icon-ring::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--primary);
            animation: spin 1.5s linear infinite;
        }

        .charging-icon-bg {
            position: absolute;
            inset: 12px;
            background: rgba(229, 57, 53, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .charging-icon-bg svg {
            width: 40px;
            height: 40px;
            color: var(--primary);
            animation: lightning-pulse 1.5s ease-in-out infinite;
        }

        @keyframes lightning-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .progress-section {
            width: 100%;
            max-width: 320px;
        }

        .progress-percent {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        .progress-percent span {
            font-size: 24px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .progress-bar-track {
            width: 100%;
            height: 8px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 999px;
            width: 0%;
            transition: width 0.3s ease;
        }

        .charging-stats {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 320px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
        }

        .btn-secondary {
            width: 100%;
            max-width: 320px;
            padding: 14px;
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(229, 57, 53, 0.05);
        }

        .btn-secondary:active {
            transform: scale(0.98);
        }

        /* Done Screen */
        .done-icon {
            width: 80px;
            height: 80px;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
        }

        .done-icon svg {
            width: 40px;
            height: 40px;
            color: #10b981;
        }

        .done-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .done-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .receipt-card {
            width: 100%;
            max-width: 320px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
        }

        .receipt-row:not(:last-child) {
            border-bottom: 1px solid var(--border);
        }

        .receipt-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .receipt-value {
            font-size: 14px;
            font-weight: 600;
        }

        .receipt-total .receipt-label {
            color: var(--text);
            font-weight: 600;
        }

        .receipt-total .receipt-value {
            color: var(--primary);
            font-size: 16px;
        }

        @media (max-width: 360px) {
            .progress-percent {
                font-size: 40px;
            }

            .charging-stats {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Screen 1: Main (Map + Charger Card) -->
    <div id="screen-charger" class="screen active">
        <div class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
            </div>
            <span class="brand">GoodWe</span>
        </div>

        <div class="main-map-container">
            <div class="map-wrapper">
                <div id="main-map"></div>
                <div class="map-loading" id="map-loading">
                    <div class="spinner"></div>
                    Buscando postos...
                </div>
                <div class="map-count" id="map-count"></div>
                <div class="route-control" id="route-control"></div>
            </div>

            <div class="charger-card">
                <div class="charger-header">
                    <div class="charger-title">
                        <div class="charger-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                            </svg>
                        </div>
                        <div>
                            <div class="charger-name">Carregador</div>
                            <div class="charger-id">GX-001</div>
                        </div>
                    </div>
                    <div class="status-badge">
                        <span class="status-dot"></span>
                        Disponível
                    </div>
                </div>

                <div class="charger-details">
                    <div class="detail-item">
                        <div class="detail-label">Tipo</div>
                        <div class="detail-value">AC 22kW</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Conector</div>
                        <div class="detail-value">Type 2</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Preço</div>
                        <div class="detail-value highlight">R$ 1,29/kWh</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Tarifa</div>
                        <div class="detail-value">Horário Pico</div>
                    </div>
                </div>

                <div class="nfc-tip">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
                        <line x1="12" y1="18" x2="12.01" y2="18"></line>
                    </svg>
                </div>

                <button class="btn-primary" onclick="startCharging()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    Iniciar Carregamento
                </button>
            </div>
        </div>
    </div>

    <div id="screen-charging" class="screen screen-charging">
        <div class="header" style="padding:16px 0;">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
            </div>
            <span class="brand">GoodWe</span>
        </div>

        <div class="charging-content">
            <div class="charging-icon-wrapper">
                <div class="charging-icon-ring"></div>
                <div class="charging-icon-bg">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                </div>
            </div>

            <div class="progress-section">
                <div class="progress-percent"><span id="percent">0</span><span>%</span></div>
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progress-bar"></div>
                </div>
            </div>

            <div class="charging-stats">
                <div class="stat-card">
                    <div class="stat-label">Tempo</div>
                    <div class="stat-value" id="time">00:00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Energia</div>
                    <div class="stat-value" id="energy">0.0 kWh</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Custo</div>
                    <div class="stat-value" id="cost">R$ 0,00</div>
                </div>
            </div>

            <button class="btn-secondary" onclick="stopCharging()">Liberar Carga</button>
        </div>
    </div>

    <!-- Screen 3: Done -->
    <div id="screen-done" class="screen screen-charging">
        <div class="header" style="padding:16px 0;">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                </svg>
            </div>
            <span class="brand">GoodWe</span>
        </div>

        <div class="charging-content">
            <div class="done-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div class="done-title">Carga Finalizada</div>
            <div class="done-subtitle">Sua sessão foi encerrada com sucesso</div>

            <div class="receipt-card">
                <div class="receipt-row">
                    <span class="receipt-label">Carregador</span>
                    <span class="receipt-value">GX-001</span>
                </div>
                <div class="receipt-row">
                    <span class="receipt-label">Duração</span>
                    <span class="receipt-value" id="final-time">00:00</span>
                </div>
                <div class="receipt-row">
                    <span class="receipt-label">Energia</span>
                    <span class="receipt-value" id="final-energy">0.0 kWh</span>
                </div>
                <div class="receipt-row receipt-total">
                    <span class="receipt-label">Total</span>
                    <span class="receipt-value" id="final-cost">R$ 0,00</span>
                </div>
            </div>

            <button class="btn-primary" onclick="resetAll()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                    <path d="M3 3v5h5"></path>
                </svg>
                Nova Carga
            </button>
        </div>
    </div>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let chargingInterval = null;
        let seconds = 0;
        let percent = 0;
        const pricePerKwh = 1.29;

        let map = null;
        let userMarker = null;
        let chargerMarkers = [];
        let routeLine = null;
        let userPosition = null;
        let chargersLayer = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (id === 'screen-charger' && map) {
                setTimeout(() => map.invalidateSize(), 100);
            }
        }

        function initMap() {
            map = L.map('main-map', {
                center: [-23.5505, -46.6333],
                zoom: 13,
                zoomControl: true
            });

            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                attribution: 'OpenStreetMap',
                maxZoom: 19
            }).addTo(map);

            chargersLayer = L.layerGroup().addTo(map);

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userPosition = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };

                    const userIcon = L.divIcon({
                        className: 'user-marker',
                        html: '',
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    });

                    userMarker = L.marker([userPosition.lat, userPosition.lng], { icon: userIcon }).addTo(map);
                    userMarker.bindPopup('Você está aqui');

                    map.setView([userPosition.lat, userPosition.lng], 14);
                    loadNearbyChargers(userPosition.lat, userPosition.lng);
                },
                (error) => {
                    console.warn('Geolocalização negada, usando localização padrão:', error);
                    const defaultLat = -23.5505;
                    const defaultLng = -46.6333;
                    userPosition = { lat: defaultLat, lng: defaultLng };

                    const userIcon = L.divIcon({
                        className: 'user-marker',
                        html: '',
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    });

                    userMarker = L.marker([userPosition.lat, userPosition.lng], { icon: userIcon }).addTo(map);
                    userMarker.bindPopup('Localização padrão');

                    map.setView([userPosition.lat, userPosition.lng], 14);
                    loadNearbyChargers(defaultLat, defaultLng);
                },
                { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
            );
        }

        const STATIONS = [
            { name: "Shell Recharge - Jardins", type: "charger", lat: -23.5615, lng: -46.6559, operator: "Shell Recharge" },
            { name: "WBES - Paulista", type: "charger", lat: -23.5620, lng: -46.6540, operator: "WBES" },
            { name: "Electromaps - Pinheiros", type: "charger", lat: -23.5670, lng: -46.6920, operator: "Electromaps" },
            { name: "Shell Recharge - Morumbi", type: "charger", lat: -23.6010, lng: -46.6970, operator: "Shell Recharge" },
            { name: "ReeCharge - Vila Madalena", type: "charger", lat: -23.5480, lng: -46.6910, operator: "ReeCharge" },
            { name: "WBES - Vila Olímpia", type: "charger", lat: -23.5970, lng: -46.6830, operator: "WBES" },
            { name: "Electromaps - Moema", type: "charger", lat: -23.6160, lng: -46.6710, operator: "Electromaps" },
            { name: "Shell Recharge - Aeroporto", type: "charger", lat: -23.4310, lng: -46.4730, operator: "Shell Recharge" },
            { name: "Carregaê - São Caetano", type: "charger", lat: -23.6250, lng: -46.5990, operator: "Carregaê" },
            { name: "WBES - Santo Amaro", type: "charger", lat: -23.6220, lng: -46.6610, operator: "WBES" },
            { name: "Electromaps - Guarulhos", type: "charger", lat: -23.4680, lng: -46.5330, operator: "Electromaps" },
            { name: "Shell Recharge - Campinas", type: "charger", lat: -22.9050, lng: -47.0600, operator: "Shell Recharge" },
            { name: "WBES - Campinas", type: "charger", lat: -22.9100, lng: -47.0550, operator: "WBES" },
            { name: "Shell Recharge - Santo André", type: "charger", lat: -23.6650, lng: -46.5300, operator: "Shell Recharge" },
            { name: "Electromaps - Santo André", type: "charger", lat: -23.6700, lng: -46.5350, operator: "Electromaps" },
        ];

        function loadNearbyChargers(lat, lng) {
            chargersLayer.clearLayers();
            chargerMarkers = [];

            const loadingEl = document.getElementById('map-loading');
            const countEl = document.getElementById('map-count');
            loadingEl.classList.add('active');
            loadingEl.innerHTML = '<div class="spinner"></div> Buscando postos...';
            countEl.classList.remove('active');

            setTimeout(() => {
                const nearby = STATIONS.map(station => ({
                    ...station,
                    _dist: calculateDistance(lat, lng, station.lat, station.lng)
                })).sort((a, b) => a._dist - b._dist);

                renderStations(nearby, lat, lng);
            }, 300);
        }

        function renderStations(stations, lat, lng) {
            const loadingEl = document.getElementById('map-loading');
            const countEl = document.getElementById('map-count');
            loadingEl.classList.remove('active');

            stations.forEach(station => {
                const iconSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>`;

                const icon = L.divIcon({
                    className: 'custom-marker',
                    html: `<div style="background:#e53935;width:32px;height:32px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;color:white;">${iconSvg}</div>`,
                    iconSize: [32, 32],
                    iconAnchor: [16, 16],
                    popupAnchor: [0, -18]
                });

                const marker = L.marker([station.lat, station.lng], { icon }).addTo(chargersLayer);
                const popupContent = `
                    <div class="charger-popup">
                        <h3>${station.name}</h3>
                        <span class="popup-type">Posto de Recarga</span>
                        ${station.operator ? `<p><strong>Operador:</strong> ${station.operator}</p>` : ''}
                        <p><strong>Distância:</strong> ${station._dist < 1 ? (station._dist * 1000).toFixed(0) + ' m' : station._dist.toFixed(1) + ' km'}</p>
                        <button class="popup-btn" onclick="startRoute(${station.lat}, ${station.lng}, '${station.name.replace(/'/g, "")}')">Ver Rota</button>
                    </div>
                `;
                marker.bindPopup(popupContent, { maxWidth: 260 });
                chargerMarkers.push({ marker, station });
            });

            if (stations.length > 0) {
                countEl.innerHTML = `<strong>${stations.length}</strong> posto(s) elétrico(s) encontrado(s)`;
                countEl.classList.add('active');
            } else {
                countEl.innerHTML = 'Nenhum posto encontrado por perto';
                countEl.classList.add('active');
            }
        }

        function startRoute(destLat, destLng, name) {
            if (!userPosition) {
                alert('Aguarde sua localização ser detectada.');
                return;
            }

            map.closePopup();

            const distance = calculateDistance(userPosition.lat, userPosition.lng, destLat, destLng);
            const timeEstimate = Math.ceil(distance * 3);

            if (routeLine) map.removeLayer(routeLine);

            routeLine = L.polyline([
                [userPosition.lat, userPosition.lng],
                [destLat, destLng]
            ], {
                color: '#e53935',
                weight: 4,
                opacity: 0.8,
                dashArray: '10, 10',
                lineCap: 'round'
            }).addTo(map);

            map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });

            const routeControl = document.getElementById('route-control');
            routeControl.classList.add('active');
            routeControl.innerHTML = `
                <div class="route-info-box">
                    <p class="route-info-title">Rota para ${name}</p>
                    <p class="route-info-detail">${distance < 1 ? (distance * 1000).toFixed(0) + ' m' : distance.toFixed(1) + ' km'} | ~${timeEstimate} min</p>
                    <a class="route-info-link" href="https://www.google.com/maps/dir/?api=1&origin=${userPosition.lat},${userPosition.lng}&destination=${destLat},${destLng}&travelmode=driving" target="_blank">Abrir no Google Maps</a>
                </div>
                <button class="btn-cancel-route" onclick="cancelRoute()">Cancelar Rota</button>
            `;
        }

        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng / 2) * Math.sin(dLng / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function cancelRoute() {
            if (routeLine) {
                map.removeLayer(routeLine);
                routeLine = null;
            }
            document.getElementById('route-control').classList.remove('active');
            document.getElementById('route-control').innerHTML = '';
        }

        // === Charging Functions ===
        function startCharging() {
            showScreen('screen-charging');
            seconds = 0;
            percent = 0;
            updateDisplay();
            chargingInterval = setInterval(() => {
                seconds++;
                percent = Math.min(100, percent + 0.5);
                updateDisplay();
                if (percent >= 100) stopCharging();
            }, 500);
        }

        function stopCharging() {
            clearInterval(chargingInterval);
            chargingInterval = null;
            document.getElementById('final-time').textContent = formatTime(seconds);
            document.getElementById('final-energy').textContent = calcEnergy();
            document.getElementById('final-cost').textContent = calcCost();
            showScreen('screen-done');
        }

        function resetAll() {
            seconds = 0;
            percent = 0;
            updateDisplay();
            showScreen('screen-charger');
        }

        function updateDisplay() {
            document.getElementById('percent').textContent = Math.floor(percent);
            document.getElementById('progress-bar').style.width = percent + '%';
            document.getElementById('time').textContent = formatTime(seconds);
            document.getElementById('energy').textContent = calcEnergy();
            document.getElementById('cost').textContent = calcCost();
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
        }

        function calcEnergy() {
            return (seconds * 0.005).toFixed(1) + ' kWh';
        }

        function calcCost() {
            return 'R$ ' + (seconds * 0.005 * pricePerKwh).toFixed(2).replace('.', ',');
        }

        document.addEventListener('DOMContentLoaded', initMap);
    </script>
</body>
</html>
